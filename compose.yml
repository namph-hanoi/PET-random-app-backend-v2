services:
  db:
    image: 'postgres:14'
    # command: postgres -c log_destination=stderr -c log_statement=all -c log_connections=on -c log_disconnections=on
    logging:
      options:
          max-size: "10k"
          max-file: "5"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgres
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_NAME}'
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      retries: 3
      timeout: 5s
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    user: root
    volumes:
      - ./:/app/
    working_dir: /app
    depends_on:
      - db
    ports:
      - '${APP_PORT}:${APP_PORT}'
    links:
      - db
    env_file:
      - .env
  # redis:
  #   build: ./docker/redis
  #   ports:
  #     - "6379:6379"

volumes:
  db-data:
